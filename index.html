<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequenciômetro CCM Anchieta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .barra-frequencia { transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1); display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; width: 0%; }
        
        body { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; position: relative; 
            background: url('bandeiras.png') no-repeat center center fixed;
            background-size: cover;
        }
        
        .overlay-fundo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.88); z-index: -1;
        }
        
        .pagina-slide { display: none; animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pagina-slide.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .card-turma { border-left-width: 12px; min-height: 135px; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes subirPodio { from { opacity: 0; transform: translateY(100px); } to { opacity: 1; transform: translateY(0); } }
        .animar-podio-bloco { animation: subirPodio 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        #barra-tempo { height: 4px; background: linear-gradient(90deg, #3b82f6, #6366f1); width: 0%; position: absolute; top: 0; left: 0; transition: width 9000ms linear; }
        
        .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 30px; height: 260px; margin-bottom: 20px; width: 100%; }
        .podium-item { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 240px; border-radius: 24px 24px 12px 24px; padding: 20px 15px; text-align: center; border: 1px solid rgba(255,255,255,0.5); }
        .btn-ctrl { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(4px); color: #1e3a8a; border-radius: 50%; width: 42px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.9); transition: all 0.3s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .btn-ctrl:hover { background: #1e3a8a; color: white; transform: scale(1.1); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="font-sans flex flex-col antialiased text-slate-800">

    <div class="overlay-fundo"></div>

    <header class="bg-white/80 backdrop-blur-md px-10 py-3 shadow-sm border-b border-slate-200/50 flex justify-between items-center shrink-0 z-10 mx-6 mt-4 rounded-2xl">
        <div class="flex items-center gap-5">
            <img src="nucleo.png" alt="NRE" class="h-12 object-contain filter drop-shadow-sm">
            <div class="h-10 w-[2px] bg-slate-300/60"></div>
            <img src="Design sem nome (1) (1).jpg" alt="CCM Anchieta" class="h-16 object-contain rounded-xl shadow-sm border border-white">
        </div>
        <div class="text-center">
            <h1 class="text-3xl font-black bg-gradient-to-r from-blue-900 to-indigo-950 bg-clip-text text-transparent uppercase leading-none tracking-tight">CCM ANCHIETA</h1>
            <p id="info-semana-detalhada" class="text-indigo-600 font-extrabold text-sm tracking-wider mt-1 uppercase">Sincronizando estatísticas...</p>
        </div>
        <div class="text-right flex items-center gap-4">
            <button onclick="forçarAberturaSorteio()" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 hover:scale-[1.03] active:scale-[0.98] transition-all uppercase tracking-wider border border-white/20">
                🎁 Realizar Sorteio
            </button>
            <div class="h-10 w-[1px] bg-slate-300/60"></div>
            <div class="text-left">
                <p id="indicador-pagina" class="text-blue-900 font-black text-xs uppercase bg-blue-100/90 backdrop-blur-sm px-4 py-1 rounded-full mb-0.5 tracking-wider border border-blue-200/50">Carregando...</p>
                <p class="text-slate-500 font-bold text-[9px] uppercase tracking-widest pl-2">Cruzeiro do Oeste - PR</p>
            </div>
        </div>
    </header>

    <main id="container-slides" class="flex-grow p-6 w-full max-w-[1850px] mx-auto overflow-hidden z-10 flex items-center justify-center text-center"></main>

    <div class="relative shrink-0 mx-6 mb-4 rounded-2xl overflow-hidden shadow-sm border border-slate-200/30">
        <div id="barra-tempo"></div>
        <footer class="w-full bg-slate-900/90 backdrop-blur-md text-white p-3.5 flex justify-between items-center px-12 text-xs font-bold uppercase tracking-wider z-50">
            <div class="flex gap-8 items-center text-[11px] font-extrabold">
                <div class="flex items-center gap-2 bg-rose-500/10 text-rose-300 px-3 py-1 rounded-lg border border-rose-500/20"><span>✋</span> < 90%</div>
                <div class="flex items-center gap-2 bg-amber-500/10 text-amber-300 px-3 py-1 rounded-lg border border-amber-500/20"><span>👍</span> 90-95%</div>
                <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-300 px-3 py-1 rounded-lg border border-emerald-500/20"><span>👏</span> > 95%</div>
            </div>
            
            <div class="flex gap-4 items-center bg-white/10 px-5 py-1.5 rounded-full border border-white/10">
                <div class="btn-ctrl" onclick="mudarSlide(-1)">⬅️</div>
                <div id="btn-pause" class="btn-ctrl" onclick="togglePause()">⏸️</div>
                <div class="btn-ctrl" onclick="mudarSlide(1)">➡️</div>
            </div>
            
            <div class="flex items-center gap-4 font-black tracking-widest text-[10px] text-slate-300">
                <span>FREQUENCIÔMETRO DIGITAL</span>
                <img src="criancas.png" alt="Estudantes" class="h-8 object-contain opacity-90 filter drop-shadow">
            </div>
        </footer>
    </div>

    <script>
        const LINK_PLANILHA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbbgsqbbRy_wIwBiuFdcsGH-Bioh3jSerab3k3lm5hYuXZrUR5WtfJXPy-wgGBwLs6zvwEiVDitiDj/pub?output=csv";
        const LINK_ALUNOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbbgsqbbRy_wIwBiuFdcsGH-Bioh3jSerab3k3lm5hYuXZrUR5WtfJXPy-wgGBwLs6zvwEiVDitiDj/pub?gid=6658576&single=true&output=csv";
        const LINK_HISTORICO = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbbgsqbbRy_wIwBiuFdcsGH-Bioh3jSerab3k3lm5hYuXZrUR5WtfJXPy-wgGBwLs6zvwEiVDitiDj/pub?gid=994844027&single=true&output=csv";

        let notaFechada1Trimestre = 91.9; 
        let todasTurmas = [], todosAlunos = [], historicoEscola = [], indexSlide = 0, loopInterval = null, isPaused = false, tempoSlideMs = 9000, tInicioSlide = 0, tRestante = 9000, animBarra = null, timersPagina = [], sorteioEmAndamento = false, mediaGeralEscolaGlobal = 0;

        function ticarSom(frequenciaHz, duracaoMs) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequenciaHz, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duracaoMs/1000);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duracaoMs/1000);
            } catch(e) {}
        }

        function obterCoresPorValor(valor) {
            if (valor >= 95) return { hex: "#10b981", tailwindTxt: "text-emerald-500", shadow: "rgba(16,185,129,0.25)" };
            if (valor >= 90) return { hex: "#f59e0b", tailwindTxt: "text-amber-500", shadow: "rgba(245,158,11,0.25)" };
            return { hex: "#e11d48", tailwindTxt: "text-rose-500", shadow: "rgba(225,29,72,0.25)" };
        }

        function atualizarTextoSemana() {
            const hoje = new Date(); const inicioAnoLetivo = new Date(2026, 1, 2); 
            const diaSemanaHoje = hoje.getDay(); const diferencaSegunda = hoje.getDate() - (diaSemanaHoje === 0 ? 6 : diaSemanaHoje - 1);
            const segundaFeira = new Date(new Date(hoje).setDate(diferencaSegunda)); const domingo = new Date(new Date(segundaFeira).setDate(segundaFeira.getDate() + 6));
            const diferencaTempo = segundaFeira.getTime() - inicioAnoLetivo.getTime(); const numSem = Math.floor(diferencaTempo / (7 * 24 * 60 * 60 * 1000)) + 1;
            const fmt = (d) => d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
            document.getElementById("info-semana-detalhada").innerText = `Estatísticas da Semana ${numSem} • ${fmt(segundaFeira)} a ${fmt(domingo)}`;
        }

        function atualizarBarraTempoAvançado() {
            const currentSlide = document.querySelector(".pagina-slide.active");
            if (isPaused || sorteioEmAndamento || (currentSlide && currentSlide.classList.contains('slide-tipo-sorteio'))) return;
            const barra = document.getElementById('barra-tempo');
            const decorrido = Date.now() - tInicioSlide;
            const pct = Math.min((decorrido / tRestante) * 100, 100);
            barra.style.width = (100 - pct) + "%";
            if (decorrido < tRestante) { animBarra = requestAnimationFrame(atualizarBarraTempoAvançado); }
        }

        function animarBarraECounter(idCard, valorFinal, tempoCustomizado) {
            const cardElement = document.getElementById(`card-${idCard}`);
            const barraElement = document.getElementById(`barra-${idCard}`);
            let valorAtual = 0; let tempoTotalEstimado = tempoCustomizado || 4500; let tempoInicio = null;

            function executarSubida(timestamp) {
                if (!tempoInicio) tempoInicio = timestamp;
                let tempoDecorrido = timestamp - tempoInicio;
                let tNorm = tempoDecorrido / tempoTotalEstimado;
                let fatorCurva = 1 - Math.pow(1 - Math.min(tNorm, 1), 4); 
                valorAtual = fatorCurva * valorFinal;

                if (tNorm >= 1 || valorAtual >= valorFinal) { valorAtual = valorFinal; }
                const coresDinamicas = obterCoresPorValor(valorAtual);

                if (barraElement) {
                    barraElement.innerText = valorAtual.toFixed(1) + "%";
                    barraElement.style.width = Math.min(valorAtual, 100) + "%";
                    barraElement.style.backgroundColor = coresDinamicas.hex;
                }
                if (cardElement) {
                    if (cardElement.classList.contains('card-turma')) cardElement.style.borderColor = coresDinamicas.hex;
                    const txtContador = cardElement.querySelector('.num-contador-txt');
                    if (txtContador) {
                        txtContador.innerText = valorAtual.toFixed(1) + "%";
                        txtContador.className = `text-5xl font-black text-center num-contador-txt ${coresDinamicas.tailwindTxt}`;
                    }
                }
                if (tNorm < 1 && valorAtual < valorFinal) { window.requestAnimationFrame(executarSubida); }
            }
            window.requestAnimationFrame(executarSubida);
        }

        // CORRIGIDO: Valores agora flutuam EXATAMENTE em cima das colunas (Segurança total contra cortes)
        function renderizarGraficoHistorico(idContainer, isFull = false) {
            const wrapper = document.getElementById(idContainer);
            if (!wrapper) return;
            wrapper.innerHTML = "";
            if (historicoEscola.length === 0) return;

            const largura = isFull ? 1000 : 440; const altura = isFull ? 350 : 200; 
            const margemX = isFull ? 50 : 30; const margemYBase = isFull ? 40 : 30;
            const frequencias = historicoEscola.map(h => h.media);
            let minF = Math.floor(Math.min(...frequencias, 85)) - 2; let maxF = 100;
            const alturaUtil = altura - margemYBase - 25; const larguraUtil = largura - 2 * margemX;
            const espacoPorBarra = larguraUtil / historicoEscola.length;
            const larguraBarra = Math.min(espacoPorBarra * 0.65, isFull ? 60 : 32); 

            let barrasHtml = "", labelsHtml = "";
            historicoEscola.forEach((dado, i) => {
                const x = margemX + (i * espacoPorBarra) + (espacoPorBarra / 2) - (larguraBarra / 2);
                const val = Math.min(Math.max(dado.media, minF), maxF); 
                const hBarra = ((val - minF) / (maxF - minF)) * alturaUtil;
                
                // ALTERAÇÃO CRUCIAL: O texto flutua EM CIMA (-8px) da coluna com a cor real do preenchimento
                const yText = altura - margemYBase - hBarra - 8;
                const coresDinamicas = obterCoresPorValor(dado.media);

                barrasHtml += `
                    <g class="grupo-barra" style="animation-delay: ${i * 120}ms;">
                        <rect x="${x}" y="${altura - margemYBase - hBarra}" width="${larguraBarra}" height="${hBarra}" fill="${coresDinamicas.hex}" rx="5" opacity="0.95" />
                        <text x="${x + larguraBarra/2}" y="${yText}" fill="${coresDinamicas.hex}" font-size="${isFull ? '14' : '11'}" font-weight="900" text-anchor="middle">${dado.media.toFixed(1)}%</text>
                    </g>`;
                labelsHtml += `<text x="${x + larguraBarra/2}" y="${altura - (isFull ? 15 : 10)}" fill="#64748b" font-size="${isFull ? '13' : '10'}" font-weight="800" text-anchor="middle">${dado.semana}</text>`;
            });

            const yMeta = altura - margemYBase - (((95 - minF) / (maxF - minF)) * alturaUtil);
            wrapper.innerHTML = `
                <svg viewBox="0 0 ${largura} ${altura}" class="w-full h-full overflow-visible">
                    <style>
                        .grupo-barra { opacity: 0; animation: fadeUpBar 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
                        @keyframes fadeUpBar { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
                    </style>
                    <line x1="${margemX}" y1="${yMeta}" x2="${largura - margemX}" y2="${yMeta}" stroke="#10b981" stroke-dasharray="5 5" stroke-width="2" opacity="0.5"/>
                    <text x="${largura - margemX + 5}" y="${yMeta + 3}" fill="#10b981" font-size="${isFull ? '12' : '9'}" font-weight="900">META</text>
                    ${labelsHtml}${barrasHtml}
                </svg>`;
        }

        // CORRIGIDO: Valores agora flutuam de forma segura em cima das colunas trimestrais
        function renderizarGraficoTrimestral(idContainer) {
            const wrapper = document.getElementById(idContainer);
            if (!wrapper) return;
            wrapper.innerHTML = "";

            const dadosTrimestres = [
                { nome: "1º Trimestre", valor: notaFechada1Trimestre, status: "Fechado" },
                { nome: "2º Trimestre", valor: mediaGeralEscolaGlobal, status: "Parcial" },
                { nome: "3º Trimestre", valor: 0.0, status: "Aguardando" }
            ];

            const largura = 900; const altura = 380; const margemX = 60; const margemYBase = 50;
            const alturaUtil = altura - margemYBase - 40; const larguraUtil = largura - 2 * margemX;
            const espacoBarra = larguraUtil / 3; const larguraBarra = 120;

            let barHtml = "", labelHtml = "";
            dadosTrimestres.forEach((t, i) => {
                const x = margemX + (i * espacoBarra) + (espacoBarra / 2) - (larguraBarra / 2);
                if (t.valor === 0) return;

                const hBarra = ((t.valor - 70) / 30) * alturaUtil;
                
                // ALTERAÇÃO: O percentual flutua em cima da coluna e o status fica fixado dentro do bloco
                const yTextPercent = altura - margemYBase - hBarra - 12;
                const yTextStatus = altura - margemYBase - hBarra + 30;
                const coresDinamicas = obterCoresPorValor(t.valor);

                barHtml += `
                    <g class="grupo-barra" style="animation-delay: ${i * 150}ms;">
                        <rect x="${x}" y="${altura - margemYBase - hBarra}" width="${larguraBarra}" height="${hBarra}" fill="${coresDinamicas.hex}" rx="12" />
                        <text x="${x + larguraBarra/2}" y="${yTextPercent}" fill="${coresDinamicas.hex}" font-size="24" font-weight="900" text-anchor="middle">${t.valor.toFixed(1)}%</text>
                        <text x="${x + larguraBarra/2}" y="${yTextStatus}" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle" opacity="0.85">${t.status.toUpperCase()}</text>
                    </g>`;
                
                labelHtml += `<text x="${x + larguraBarra/2}" y="${altura - 15}" fill="#1e293b" font-size="16" font-weight="900" text-anchor="middle">${t.nome}</text>`;
            });

            const yMeta = altura - margemYBase - (((95 - 70) / 30) * alturaUtil);
            wrapper.innerHTML = `
                <svg viewBox="0 0 ${largura} ${altura}" class="w-full h-full overflow-visible">
                    <line x1="${margemX}" y1="${yMeta}" x2="${largura - margemX}" y2="${yMeta}" stroke="#10b981" stroke-dasharray="6 6" stroke-width="2.5" opacity="0.6"/>
                    <text x="${largura - margemX + 8}" y="${yMeta + 4}" fill="#10b981" font-size="12" font-weight="900">META</text>
                    ${labelHtml}${barHtml}
                </svg>`;
        }

        function mudarSlide(direcao) {
            if (sorteioEmAndamento) return;
            const slides = document.querySelectorAll(".pagina-slide");
            if (slides.length <= 1) return;
            timersPagina.forEach(t => clearTimeout(t)); timersPagina = [];
            
            slides[indexSlide].classList.remove("active");
            indexSlide = (indexSlide + direcao + slides.length) % slides.length;
            
            if (slides[indexSlide].classList.contains('slide-tipo-sorteio')) {
                indexSlide = (indexSlide + direcao + slides.length) % slides.length;
            }
            
            slides[indexSlide].classList.add("active");
            document.getElementById("indicador-pagina").innerText = `Pág. ${indexSlide + 1} de ${slides.length}`;
            
            const currentSlide = slides[indexSlide];
            if (indexSlide === 0) { carregarDadosEmBack(); }

            if (currentSlide.classList.contains('slide-tipo-lista')) {
                const containerGrafico = currentSlide.querySelector('.box-plot-grafico');
                if (containerGrafico) { renderizarGraficoHistorico(containerGrafico.id); }
                currentSlide.querySelectorAll('.card-turma').forEach(el => {
                    animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 5000);
                });
            } 
            else if (currentSlide.classList.contains('slide-tipo-desafio-full')) {
                renderizarGraficoHistorico('grafico-full-desafio', true);
                animarBarraECounter(currentSlide.querySelector('.card-bloco-media').dataset.id, mediaGeralEscolaGlobal, 5000);
            }
            else if (currentSlide.classList.contains('slide-tipo-trimestral')) {
                renderizarGraficoTrimestral('grafico-trimestral-box');
            }
            // CORRIGIDO: Ativação da Coroa de Vencedor na Disputa de Turnos
            else if (currentSlide.classList.contains('slide-tipo-disputa')) {
                const coroaM = currentSlide.querySelector('.coroa-m');
                const coroaT = currentSlide.querySelector('.coroa-t');
                if (coroaM) coroaM.style.opacity = "0";
                if (coroaT) coroaT.style.opacity = "0";

                currentSlide.querySelectorAll('.card-bloco-media').forEach(el => { 
                    animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 4500); 
                });

                setTimeout(() => {
                    if (coroaM && coroaM.dataset.vencedor === "true") { coroaM.style.opacity = "1"; coroaM.classList.add("scale-110"); }
                    if (coroaT && coroaT.dataset.vencedor === "true") { coroaT.style.opacity = "1"; coroaT.classList.add("scale-110"); }
                }, 4600);
            }
            else if (currentSlide.classList.contains('slide-tipo-top5')) {
                const lines = currentSlide.querySelectorAll('.linha-top5');
                lines.forEach((l, idx) => {
                    setTimeout(() => {
                        l.style.opacity = "1";
                        l.style.transform = "translateY(0)";
                        const spanTxt = l.querySelector('.num-contador-txt');
                        if (spanTxt) {
                            let valFinal = parseFloat(l.dataset.target);
                            let valAtual = 0;
                            function subir() {
                                valAtual += valFinal / 40;
                                if(valAtual >= valFinal) { valAtual = valFinal; } else { requestAnimationFrame(subir); }
                                spanTxt.innerText = valAtual.toFixed(1) + "%";
                                spanTxt.className = `font-black text-3xl num-contador-txt ${obterCoresPorValor(valFinal).tailwindTxt}`;
                            }
                            subir();
                        }
                    }, idx * 250);
                });
            }
            // CORRIGIDO: Ativação, posicionamento e cálculo dos blocos do Ranking (Pódio)
            else if (currentSlide.classList.contains('slide-tipo-ranking')) {
                const pod1 = currentSlide.querySelector('.pod-ouro'), pod2 = currentSlide.querySelector('.pod-prata'), pod3 = currentSlide.querySelector('.pod-bronze');
                const demaisClass = currentSlide.querySelector('.demais-class-box');

                if (pod1) { pod1.style.animation = "none"; pod1.style.opacity = "0"; }
                if (pod2) { pod2.style.animation = "none"; pod2.style.opacity = "0"; }
                if (pod3) { pod3.style.animation = "none"; pod3.style.opacity = "0"; }
                if (demaisClass) demaisClass.style.opacity = "0";

                if (pod3) setTimeout(() => { 
                    pod3.style.animation = "subirPodio 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards"; 
                    animarBarraECounter(pod3.dataset.id, parseFloat(pod3.dataset.target), 2000); 
                }, 800);
                if (pod2) setTimeout(() => { 
                    pod2.style.animation = "subirPodio 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards"; 
                    animarBarraECounter(pod2.dataset.id, parseFloat(pod2.dataset.target), 2000); 
                }, 2200);
                if (pod1) setTimeout(() => { 
                    pod1.style.animation = "subirPodio 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards"; 
                    animarBarraECounter(pod1.dataset.id, parseFloat(pod1.dataset.target), 2000); 
                    if (demaisClass) {
                        demaisClass.style.transition = "opacity 0.6s ease"; demaisClass.style.opacity = "1";
                        demaisClass.querySelectorAll('.card-bloco-media').forEach(el => { animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 2000); });
                    }
                }, 3600);
                setTimeout(dispararConfetesEspeciais, 5200);
            }

            tRestante = tempoSlideMs; tInicioSlide = Date.now();
            if (!isPaused) {
                clearTimeout(loopInterval); cancelAnimationFrame(animBarra);
                loopInterval = setTimeout(() => mudarSlide(1), tempoSlideMs); atualizarBarraTempoAvançado();
            }
        }

        function forçarAberturaSorteio() {
            if (sorteioEmAndamento) return;
            clearInterval(loopInterval); cancelAnimationFrame(animBarra);
            timersPagina.forEach(t => clearTimeout(t));
            document.getElementById('barra-tempo').style.width = "0%";
            
            const slides = document.querySelectorAll(".pagina-slide");
            slides.forEach(s => s.classList.remove("active"));
            
            const slideSorteio = document.querySelector(".slide-tipo-sorteio");
            if(slideSorteio) {
                slideSorteio.classList.add("active");
                document.getElementById("indicador-pagina").innerText = `MODO SORTEIO`;
                document.getElementById("nome-sorteado-display").innerText = "???";
            }
        }

        function fecharModoSorteio() {
            if (sorteioEmAndamento) return;
            const slides = document.querySelectorAll(".pagina-slide");
            slides.forEach(s => s.classList.remove("active"));
            indexSlide = 0; slides[indexSlide].classList.add("active");
            isPaused = false; document.getElementById('btn-pause').innerText = '⏸️';
            iniciarAnimacao();
        }

        function dispararConfetesEspeciais() {
            var duracao = 1.5 * 1000; var fim = Date.now() + duracao;
            (function moldura() {
                confetti({ particleCount: 4, angle: 60, spread: 60, origin: { x: 0, y: 0.75 } });
                confetti({ particleCount: 4, angle: 120, spread: 60, origin: { x: 1, y: 0.75 } });
                if (Date.now() < fim) { requestAnimationFrame(moldura); }
            }());
        }

        function iniciarSorteioVirtual() {
            if (sorteioEmAndamento) return;
            const seletor = document.getElementById("seletor-turma-sorteio"); const turmaAlvo = seletor.value;
            const alunosFiltrados = todosAlunos.filter(a => a.turma.toLowerCase() === turmaAlvo.toLowerCase());
            const displayNome = document.getElementById("nome-sorteado-display");
            const btn = document.getElementById("btn-trigger-sorteio"); const btnFechar = document.getElementById("btn-fechar-sorteio");
            if (alunosFiltrados.length === 0) { displayNome.innerText = "Sem alunos na turma!"; return; }

            sorteioEmAndamento = true; btn.style.display = "none"; btnFechar.style.display = "none"; seletor.disabled = true; 
            let giros = 0; let velocidade = 50; let totalGiros = 50; 

            function roletar() {
                giros++; const indiceAleatorio = Math.floor(Math.random() * alunosFiltrados.length);
                const nomeCandidato = alunosFiltrados[indiceAleatorio].nome;
                displayNome.innerText = nomeCandidato; ajustarFonteNomeSorteado(nomeCandidato);
                ticarSom(600 - (giros * 5), 40);
                if (giros < totalGiros) { if (giros > totalGiros - 15) velocidade += 35; setTimeout(roletar, velocidade); } 
                else {
                    ticarSom(880, 250); setTimeout(() => ticarSom(1200, 300), 150); dispararConfetesEspeciais();
                    let cLoop = setInterval(dispararConfetesEspeciais, 800);
                    setTimeout(() => { clearInterval(cLoop); sorteioEmAndamento = false; seletor.disabled = false; btn.style.display = "inline-block"; btn.innerText = "🎰 REFAZER SORTEIO"; btnFechar.style.display = "inline-block"; }, 6000);
                }
            }
            roletar();
        }

        function ocluiSorteio() { if(!sorteioEmAndamento) fecharModoSorteio(); }

        function montarPaginas(lista, titulo, col, idStart) {
            const container = document.getElementById("container-slides");
            let localId = idStart;
            for (let i = 0; i < lista.length; i += 6) {
                const pedaço = lista.slice(i, i + 6);
                const slide = document.createElement("div");
                slide.className = "pagina-slide w-full h-full pt-2 slide-tipo-lista";
                const temElite = pedaço.some(t => t.valor >= 95);
                if(temElite) slide.dataset.hasElite = "true";

                const idGraficoPagina = `grafico-split-box-${localId}`;

                slide.innerHTML = `
                    <div class="flex items-stretch gap-6 w-full max-w-[1800px] h-full mx-auto">
                        <div class="w-[38%] glass-card rounded-[2.5rem] p-6 flex flex-col justify-between border-t-8 border-t-indigo-600 text-center">
                            <div>
                                <span class="text-indigo-600 font-black text-sm tracking-widest uppercase block mb-0.5">EVOLUÇÃO ANCHIETA</span>
                                <h2 class="text-slate-500 font-extrabold text-xs uppercase tracking-wider">Histórico de Frequência da Escola</h2>
                            </div>
                            <div id="${idGraficoPagina}" class="box-plot-grafico w-full h-[190px] my-2 bg-white/40 border border-slate-200/50 p-2 rounded-2xl shadow-inner flex items-center justify-center">
                                <span class="text-slate-400 font-bold text-xs animate-pulse">Carregando gráfico...</span>
                            </div>
                            <div class="bg-indigo-50/70 border border-indigo-100/50 p-3 rounded-2xl flex justify-between items-center px-6">
                                <span class="font-extrabold text-slate-500 text-xs uppercase tracking-wide">Média da Semana Atual:</span>
                                <span class="font-black text-2xl text-indigo-600">${mediaGeralEscolaGlobal.toFixed(1)}%</span>
                            </div>
                        </div>

                        <div class="w-[62%] flex flex-col justify-between">
                            <div class="${col} text-white py-2 px-12 rounded-2xl font-black text-xl mb-4 shadow-md uppercase w-fit tracking-wider border border-white/10 self-center">${titulo}</div>
                            <div class="grid grid-cols-2 gap-4 w-full h-full">
                                ${pedaço.map(t => { 
                                    localId++;
                                    return `
                                        <div id="card-${localId}" data-id="${localId}" data-target="${t.valor}" class="p-4 rounded-[2rem] card-turma glass-card card-animado text-left flex flex-col justify-between border-l-rose-500">
                                            <div class="flex justify-between items-center mb-1">
                                                <p class="font-black text-slate-900 text-xl md:text-2xl uppercase tracking-tight truncate max-w-[75%] leading-none">${t.nome}</p>
                                                <p class="text-lg leading-none filter drop-shadow-sm">${"🏆".repeat(t.trofeus)}</p>
                                            </div>
                                            <div class="w-full bg-slate-200/50 rounded-xl h-10 overflow-hidden relative shadow-inner flex items-center border border-slate-300/10">
                                                <div id="barra-${localId}" class="barra-frequencia h-full text-lg bg-rose-500" style="width: 0%">0.0%</div>
                                            </div>
                                        </div>`; 
                                }).join("")}
                            </div>
                        </div>
                    </div>`;
                container.appendChild(slide);
            }
            return localId;
        }

        // CORRIGIDO: Atributo id="card-..." injetado corretamente na string HTML do Pódio
        function montarSlideRankingTurno(listaTurno, titulo, col, idStart) {
            const container = document.getElementById("container-slides");
            const ordenadas = [...listaTurno].sort((a, b) => b.valor - a.valor);
            const top3 = ordenadas.slice(0, 3); const restante = ordenadas.slice(3);
            if (top3.length < 1) return idStart;

            let localId = idStart; const slide = document.createElement("div");
            slide.className = "pagina-slide w-full h-full pt-2 slide-tipo-ranking";
            const nome1 = top3[0] ? top3[0].nome : "-"; const val1 = top3[0] ? top3[0].valor : 0;
            const nome2 = top3[1] ? top3[1].nome : "-"; const val2 = top3[1] ? top3[1].valor : 0;
            const nome3 = top3[2] ? top3[2].nome : "-"; const val3 = top3[2] ? top3[2].valor : 0;

            localId++; let idPod1 = localId; localId++; let idPod2 = localId; localId++; let idPod3 = localId;

            slide.innerHTML = `
                <div class="flex flex-col h-full items-center justify-start max-w-5xl mx-auto">
                    <div class="${col} text-white py-2 px-14 rounded-2xl font-black text-xl mb-4 shadow-md uppercase w-fit tracking-wide border border-white/10">${titulo}</div>
                    <div class="podium-container shrink-0">
                        ${top3[1] ? `<div id="card-${idPod2}" data-id="${idPod2}" data-target="${val2}" class="podium-item pod-prata glass-card border-b-[6px] border-slate-400 shadow-xl order-1 h-[85%] opacity-0"><span class="text-4xl mb-1 filter drop-shadow-sm">🥈</span><p class="text-slate-800 font-black text-lg uppercase truncate w-full px-2 tracking-tight">${nome2}</p><span class="text-4xl font-black text-rose-500 mt-2 block w-full num-contador-txt">0.0%</span></div>` : ''}
                        ${top3[0] ? `<div id="card-${idPod1}" data-id="${idPod1}" data-target="${val1}" class="podium-item pod-ouro glass-card border-b-[6px] border-amber-400 shadow-2xl order-2 h-[100%] scale-105 opacity-0"><span class="text-5xl mb-1 filter drop-shadow-sm">🥇</span><p class="text-blue-950 font-black text-xl uppercase truncate w-full px-2 tracking-tight">${nome1}</p><span class="text-5xl font-black text-rose-600 mt-2 block w-full num-contador-txt">0.0%</span></div>` : ''}
                        ${top3[2] ? `<div id="card-${idPod3}" data-id="${idPod3}" data-target="${val3}" class="podium-item pod-bronze glass-card border-b-[6px] border-orange-400 shadow-xl order-3 h-[70%] opacity-0"><span class="text-4xl mb-1 filter drop-shadow-sm">🥉</span><p class="text-amber-900 font-black text-lg uppercase truncate w-full px-2 tracking-tight">${nome3}</p><span class="text-4xl font-black text-rose-600 mt-2 block w-full num-contador-txt">0.0%</span></div>` : ''}
                    </div>
                    <div class="w-full glass-card rounded-2xl p-4 shadow-xl overflow-hidden flex-grow max-h-[200px] overflow-y-auto mb-2 demais-class-box opacity-0">
                        <h4 class="text-slate-500 font-black text-[11px] uppercase tracking-widest text-left mb-1 border-b border-slate-300/60 pb-1">Demais Classificações:</h4>
                        <div class="grid grid-cols-2 gap-x-6 gap-y-1.5 text-left">
                            ${restante.map((t) => {
                                localId++;
                                return `
                                    <div id="card-${localId}" data-id="${localId}" data-target="${t.valor}" class="flex justify-between items-center bg-white/60 px-4 py-1.5 rounded-xl border border-white shadow-sm card-bloco-media">
                                        <span class="font-black text-slate-700 text-base uppercase truncate max-w-[65%] tracking-tight">${t.nome}</span>
                                        <span class="font-black text-xl text-rose-500 shrink-0 num-contador-txt">0.0%</span>
                                    </div>`;
                            }).join("")}
                        </div>
                    </div>
                </div>`;
            container.appendChild(slide);
            return localId;
        }

        async function carregarDadosEmBack() {
            try {
                const resAlunos = await fetch(LINK_ALUNOS + "&cache=" + Date.now());
                const txtAlunos = await resAlunos.text(); const linhasAlunos = txtAlunos.split(/\r?\n/);
                let novosAlunos = [];
                for (let j = 1; j < linhasAlunos.length; j++) {
                    if (linhasAlunos[j].trim().length < 3) continue;
                    const colsA = linhasAlunos[j].split(/[,;]/).map(c => c.replace(/^"|"$/g, '').trim());
                    if (colsA.length >= 2) { novosAlunos.push({ nome: colsA[0], turma: colsA[1] }); }
                }
                if (novosAlunos.length > 0) todosAlunos = novosAlunos;
            } catch(e) { }
        }

        async function carregarDados() {
            try {
                const res = await fetch(LINK_PLANILHA + "&cache=" + Date.now());
                if(!res.ok) throw new Error("Erro Planilha Principal");
                const txt = await res.text(); const linhas = txt.split(/\r?\n/);
                todasTurmas = [];
                for (let i = 1; i < linhas.length; i++) {
                    if (linhas[i].trim().length < 4) continue;
                    const cols = linhas[i].split(/[,;]/).map(c => c.replace(/^"|"$/g, '').trim());
                    if (cols.length >= 2) {
                        const nome = cols[0]; const freq = parseFloat(cols[1].replace(",", "."));
                        const turno = cols[2] ? cols[2].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "tarde";
                        const trof = parseInt(cols[3]) || 0;
                        if (!isNaN(freq) && nome.length > 0) todasTurmas.push({ nome, valor: freq, bloco: turno, trofeus: trof });
                    }
                }
                try {
                    const resAlunos = await fetch(LINK_ALUNOS + "&cache=" + Date.now());
                    const txtAlunos = await resAlunos.text(); const linhasAlunos = txtAlunos.split(/\r?\n/);
                    todosAlunos = [];
                    for (let j = 1; j < linhasAlunos.length; j++) {
                        if (linhasAlunos[j].trim().length < 3) continue;
                        const colsA = linhasAlunos[j].split(/[,;]/).map(c => c.replace(/^"|"$/g, '').trim());
                        if (colsA.length >= 2) todosAlunos.push({ nome: colsA[0], turma: colsA[1] });
                    }
                } catch(eA) { }

                try {
                    const resHist = await fetch(LINK_HISTORICO + "&cache=" + Date.now());
                    const txtHist = await resHist.text(); const linhasHist = txtHist.split(/\r?\n/);
                    historicoEscola = [];
                    for(let k = 1; k < linhasHist.length; k++) {
                        if (linhasHist[k].trim().length < 3) continue;
                        const colsH = linhasHist[k].split(/[,;]/).map(c => c.replace(/^"|"$/g, '').trim());
                        if(colsH.length >= 2) {
                            let semNome = colsH[0]; if(semNome.toLowerCase() !== "esta") { semNome = "S" + semNome; }
                            const medVal = parseFloat(colsH[1].replace(",", "."));
                            if(!isNaN(medVal)) historicoEscola.push({ semana: semNome, media: medVal });
                        }
                    }
                    if (historicoEscola.length > 10) { historicoEscola = historicoEscola.slice(-10); }
                } catch(errH) { }

                if (todasTurmas.length > 0) {
                    mediaGeralEscolaGlobal = todasTurmas.reduce((acc, t) => acc + t.valor, 0) / todasTurmas.length;
                    if (historicoEscola.length > 0 && historicoEscola[historicoEscola.length - 1].semana.toLowerCase() === "esta") {
                        historicoEscola[historicoEscola.length - 1].media = mediaGeralEscolaGlobal;
                    }
                    atualizarTextoSemana(); gerarSlides();
                }
            } catch (err) { console.error(err); }
        }

        function iniciarAnimacao() {
            if (loopInterval) clearTimeout(loopInterval);
            cancelAnimationFrame(animBarra);
            timersPagina.forEach(t => clearTimeout(t)); timersPagina = [];

            const slides = document.querySelectorAll(".pagina-slide");
            if (slides.length === 0) return;
            indexSlide = 0; slides[indexSlide].classList.add('active');
            document.getElementById("indicador-pagina").innerText = `Pág. 1 de ${slides.length}`;
            
            if (slides[indexSlide].classList.contains('slide-tipo-lista')) {
                const containerGrafico = slides[indexSlide].querySelector('.box-plot-grafico');
                if (containerGrafico) { renderizarGraficoHistorico(containerGrafico.id); }
                slides[indexSlide].querySelectorAll('.card-turma').forEach(el => { animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 5000); });
            }

            tRestante = tempoSlideMs; tInicioSlide = Date.now();
            if (!isPaused) {
                loopInterval = setTimeout(() => mudarSlide(1), tempoSlideMs);
                atualizarBarraTempoAvançado();
            }
        }

        window.onload = carregarDados;
    </script>

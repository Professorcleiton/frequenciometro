<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequenciômetro CCM Anchieta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
    <style>
        .barra-frequencia { 
            transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: 900; 
            width: 0%; 
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
        }
        .card-turma { 
            border-left-width: 12px; 
            min-height: 135px; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        @keyframes subirPodio { 
            from { opacity: 0; transform: translateY(100px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animar-podio-bloco { 
            animation: subirPodio 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0; 
        }
        
        #barra-tempo { 
            height: 4px; 
            background: linear-gradient(90deg, #3b82f6, #6366f1); 
            width: 0%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            transition: width 9000ms linear; 
        }
        
        .podium-container { 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            gap: 30px; 
            height: 260px; 
            margin-bottom: 20px; 
            width: 100%; 
        }
        .podium-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-end; 
            width: 240px; 
            border-radius: 24px 24px 12px 24px; 
            padding: 20px 15px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.5); 
        }
        .btn-ctrl { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(4px); 
            color: #1e3a8a; 
            border-radius: 50%; 
            width: 42px; 
            height: 32px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.9); 
            transition: all 0.3s; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
        }
        .btn-ctrl:hover { 
            background: #1e3a8a; 
            color: white; 
            transform: scale(1.1); 
        }
        ::-webkit-scrollbar { display: none; }

        @keyframes pulse-sorteio {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .sorteio-animando {
            animation: pulse-sorteio 0.3s ease-in-out infinite;
        }
        @keyframes brilho-vencedor {
            0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.8); }
            100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
        }
        .vencedor-animacao {
            animation: brilho-vencedor 1s ease-in-out infinite;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="font-sans flex flex-col antialiased text-slate-800">

    <div class="fundo-textura"></div>

    <!-- Modal para gerenciar alunos sorteados -->
    <div id="modal-sorteados" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-black text-slate-800 uppercase">Gerenciar Alunos Sorteados</h3>
                <button onclick="fecharModalSorteados()" class="w-8 h-8 bg-slate-200 hover:bg-slate-300 rounded-full font-bold text-slate-600 transition-all">✕</button>
            </div>
            <p class="text-sm text-slate-500 mb-4">Marque os alunos que já foram sorteados para evitar repetição.</p>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-2">Selecione a Turma:</label>
                <select id="seletor-turma-modal" onchange="atualizarListaAlunosModal()" class="w-full bg-white border-2 border-indigo-200 rounded-xl px-4 py-2 font-bold text-slate-800">
                    <option value="">Todas as Turmas</option>
                </select>
            </div>
            
            <div id="lista-alunos-modal" class="space-y-2 mb-4">
                <p class="text-slate-400 text-center py-4">Carregando alunos...</p>
            </div>
            
            <div class="flex justify-end gap-3">
                <button onclick="limparTodosSorteados()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-sm px-4 py-2 rounded-xl transition-all">
                    🗑️ Limpar Todos
                </button>
                <button onclick="recarregarListaAlunos()" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold text-sm px-4 py-2 rounded-xl transition-all">
                    🔄 Atualizar Lista
                </button>
                <button onclick="fecharModalSorteados()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-2 rounded-xl transition-all">
                    Concluir
                </button>
            </div>
        </div>
    </div>

    <header class="bg-white/80 backdrop-blur-md px-10 py-3 shadow-sm border-b border-slate-200/50 flex justify-between items-center shrink-0 z-10 mx-6 mt-4 rounded-2xl">
        <div class="flex items-center gap-5">
            <img src="nucleo.png" alt="NRE" class="h-12 object-contain filter drop-shadow-sm">
            <div class="h-10 w-[2px] bg-slate-300/60"></div>
            <img src="Design sem nome (1) (1).jpg" alt="CCM Anchieta" class="h-16 object-contain rounded-xl shadow-sm border border-white">
        </div>
        <div class="text-center">
            <h1 class="text-3xl font-black bg-gradient-to-r from-blue-900 to-indigo-950 bg-clip-text text-transparent uppercase leading-none tracking-tight">CCM ANCHIETA</h1>
            <p id="info-semana-detalhada" class="text-indigo-600 font-extrabold text-sm tracking-wider mt-1 uppercase transition-colors duration-300">Iniciando sistema e buscando dados...</p>
        </div>
        <div class="text-right flex items-center gap-3">
            <button onclick="forcarAtualizacaoCompleta()" class="bg-gradient-to-r from-emerald-500 to-green-600 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-600/20 hover:scale-[1.03] active:scale-[0.98] transition-all uppercase tracking-wider border border-white/20">
                🔄 Atualizar
            </button>
            <button onclick="abrirModalSorteados()" class="bg-gradient-to-r from-amber-500 to-orange-600 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-amber-600/20 hover:scale-[1.03] active:scale-[0.98] transition-all uppercase tracking-wider border border-white/20">
                📋 Sorteados
            </button>
            <button onclick="forçarAberturaSorteio()" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-600/20 hover:scale-[1.03] active:scale-[0.98] transition-all uppercase tracking-wider border border-white/20">
                🎁 Sorteio
            </button>
            <div class="h-10 w-[1px] bg-slate-300/60"></div>
            <div class="text-left">
                <p id="indicador-pagina" class="text-blue-900 font-black text-xs uppercase bg-blue-100/90 backdrop-blur-sm px-4 py-1 rounded-full mb-0.5 tracking-wider border border-blue-200/50">Aguarde...</p>
                <p class="text-slate-500 font-bold text-[9px] uppercase tracking-widest pl-2">Cruzeiro do Oeste - PR</p>
            </div>
        </div>
    </header>

    <main id="container-slides" class="flex-grow p-6 w-full max-w-[1850px] mx-auto overflow-hidden z-10 flex items-center justify-center text-center"></main>

    <div class="relative shrink-0 mx-6 mb-4 rounded-2xl overflow-hidden shadow-sm border border-slate-200/30">
        <div id="barra-tempo"></div>
        <footer class="w-full bg-slate-900/90 backdrop-blur-md text-white p-3.5 flex justify-between items-center px-12 text-xs font-bold uppercase tracking-wider z-50">
            <div class="flex gap-8 items-center text-[11px] font-extrabold">
                <div class="flex items-center gap-2 bg-rose-500/10 text-rose-300 px-3 py-1 rounded-lg border border-rose-500/20"><span>✋</span> < 90%</div>
                <div class="flex items-center gap-2 bg-amber-500/10 text-amber-300 px-3 py-1 rounded-lg border border-amber-500/20"><span>👍</span> 90-95%</div>
                <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-300 px-3 py-1 rounded-lg border border-emerald-500/20"><span>👏</span> > 95%</div>
            </div>
            <div class="flex gap-4 items-center bg-white/10 px-5 py-1.5 rounded-full border border-white/10">
                <div class="btn-ctrl" onclick="mudarSlide(-1)">⬅️</div>
                <div id="btn-pause" class="btn-ctrl" onclick="togglePause()">⏸️</div>
                <div class="btn-ctrl" onclick="mudarSlide(1)">➡️</div>
            </div>
            <div class="flex items-center gap-4 font-black tracking-widest text-[10px] text-slate-300">
                <span>FREQUENCIÔMETRO DIGITAL</span>
                <img src="criancas.png" alt="Estudantes" class="h-8 object-contain opacity-90 filter drop-shadow">
            </div>
        </footer>
    </div>

    <script>
        // ===== LINKS DA PLANILHA =====
        const LINK_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQV2zvnMyHFvZKDraWNcSyCMhfyKiMn0UU8EppGHQkDGs1lh5iyYxvICV522gkVrMKKtxxcd411IjJQ/pub";
        const LINK_FREQUENCIA = `${LINK_BASE}?gid=1746538498&single=true&output=csv`;
        const LINK_ALUNOS = `${LINK_BASE}?gid=1866544411&single=true&output=csv`;
        const LINK_HISTORICO = `${LINK_BASE}?gid=541390615&single=true&output=csv`;

        // ===== VARIÁVEIS GLOBAIS =====
        let notaFechada1Trimestre = 91.9; 
        let todasTurmas = [], todosAlunos = [], historicoEscola = [], indexSlide = 0, loopInterval = null, isPaused = false, tempoSlideMs = 9000, tInicioSlide = 0, tRestante = 9000, animBarra = null, timersPagina = [], sorteioEmAndamento = false, mediaGeralEscolaGlobal = 0;
        let alunosJaSorteados = new Set();
        let historicoSorteios = [];

        // ===== FUNÇÃO PARA NORMALIZAR CÓDIGO DE TURMA =====
        function extrairCodigoTurma(nomeTurma) {
            if (!nomeTurma) return '';
            
            return nomeTurma
                .toString()
                .toUpperCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/º|ª|°/g, "")
                .replace(/-/g, "")
                .replace(/\bEF\b/g, "")
                .replace(/\bEM\b/g, "")
                .replace(/\bANOS\b/g, "")
                .replace(/\bANO\b/g, "")
                .replace(/\bSERIE\b/g, "")
                .replace(/\bSÉRIE\b/g, "")
                .replace(/\s+/g, "")
                .trim();
        }

        // ===== FUNÇÕES DE STORAGE =====
        function carregarSorteadosDoStorage() {
            try {
                const sorteadosSalvos = localStorage.getItem('alunosSorteados');
                if (sorteadosSalvos) {
                    alunosJaSorteados = new Set(JSON.parse(sorteadosSalvos));
                }
            } catch(e) {}
        }

        function salvarSorteadosNoStorage() {
            try {
                localStorage.setItem('alunosSorteados', JSON.stringify(Array.from(alunosJaSorteados)));
            } catch(e) {}
        }

        // ===== FUNÇÃO PARA CARREGAR FREQUÊNCIA =====
        async function carregarFrequencia() {
            const resFreq = await fetch(LINK_FREQUENCIA + "&cache=" + Date.now());
            if(!resFreq.ok) throw new Error("Planilha de Frequência falhou");
            const txtFreq = await resFreq.text();
            const dFreq = txtFreq.includes(';') ? ';' : ',';
            const linhasFreq = txtFreq.split(/\r?\n/);
            todasTurmas = [];
            
            for (let i = 1; i < linhasFreq.length; i++) {
                if (linhasFreq[i].trim().length < 3) continue;
                const cols = linhasFreq[i].split(new RegExp(`\\s*${dFreq}\\s*(?=(?:[^"]*"[^"]*")*[^"]*$)`)).map(c => c.replace(/^"|"$/g, '').trim());
                
                if (cols.length >= 4) {
                    const nome = cols[0];
                    let strNum = cols[1].replace(/[^0-9,-]/g, '').replace(',', '.');
                    const freq = parseFloat(strNum);
                    const bloco = (cols[2] || "tarde").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                    const trof = parseInt(cols[3]) || 0;
                    const codigo = extrairCodigoTurma(nome);
                    
                    if (!isNaN(freq) && nome.length > 0) {
                        todasTurmas.push({ 
                            nome, 
                            valor: freq, 
                            bloco: bloco.includes("man") ? "manha":"tarde", 
                            trofeus: trof,
                            codigo: codigo
                        });
                    }
                }
            }
            console.log(`✅ ${todasTurmas.length} turmas carregadas`);
            console.log("Exemplos:", todasTurmas.slice(0, 3).map(t => `${t.nome} → ${t.codigo}`));
        }

        // ===== FUNÇÃO PARA CARREGAR ALUNOS =====
        async function carregarAlunos() {
            try {
                const resposta = await fetch(LINK_ALUNOS + "&cache=" + Date.now());
                if (!resposta.ok) throw new Error("Falha ao carregar lista de alunos");
                
                const texto = await resposta.text();
                const delimitador = texto.includes(';') ? ';' : ',';
                const linhas = texto.split(/\r?\n/);
                
                todosAlunos = [];
                for (let j = 1; j < linhas.length; j++) {
                    const colunas = linhas[j].split(new RegExp(`\\s*${delimitador}\\s*(?=(?:[^"]*"[^"]*")*[^"]*$)`)).map(c => c.replace(/^"|"$/g, '').trim());
                    
                    if (colunas.length >= 4 && colunas[1]) {
                        const turmaRef = colunas[2] || '';
                        const turmaCodigo = colunas[3] || '';
                        
                        todosAlunos.push({ 
                            id: colunas[0] || '',
                            nome: colunas[1].trim(),
                            turmaRef: turmaRef,
                            turmaCodigo: turmaCodigo,
                            codigoNormalizado: extrairCodigoTurma(turmaCodigo || turmaRef)
                        });
                    }
                }
                console.log(`✅ ${todosAlunos.length} alunos carregados`);
                console.log("Exemplos:", todosAlunos.slice(0, 3).map(a => `${a.nome} → ${a.codigoNormalizado}`));
                return true;
            } catch (erro) {
                console.error("❌ Erro ao carregar alunos:", erro);
                return false;
            }
        }

        // ===== FUNÇÃO PARA CARREGAR HISTÓRICO =====
        async function carregarHistorico() {
            try {
                const resHist = await fetch(LINK_HISTORICO + "&cache=" + Date.now());
                const txtHist = await resHist.text();
                const dHist = txtHist.includes(';') ? ';' : ',';
                const linhasHist = txtHist.split(/\r?\n/);
                historicoEscola = [];
                for(let k = 1; k < linhasHist.length; k++) {
                    const colsH = linhasHist[k].split(new RegExp(`\\s*${dHist}\\s*(?=(?:[^"]*"[^"]*")*[^"]*$)`)).map(c => c.replace(/^"|"$/g, '').trim());
                    if(colsH.length >= 2) {
                        let semNome = colsH[0];
                        let strH = colsH[1].replace(/[^0-9,-]/g, '').replace(',', '.');
                        const medVal = parseFloat(strH);
                        if(!isNaN(medVal)) historicoEscola.push({ semana: semNome, media: medVal });
                    }
                }
                if (historicoEscola.length > 10) historicoEscola = historicoEscola.slice(-10);
                console.log(`✅ ${historicoEscola.length} registros de histórico carregados`);
            } catch(errH) { 
                console.warn("Histórico pulado.", errH); 
            }
        }

        // ===== FUNÇÃO PRINCIPAL DE CARREGAMENTO =====
        async function carregarDados() {
            try {
                carregarSorteadosDoStorage();
                await carregarFrequencia();
                await carregarAlunos();
                await carregarHistorico();
                
                mediaGeralEscolaGlobal = todasTurmas.reduce((acc, t) => acc + t.valor, 0) / todasTurmas.length;
                
                atualizarTextoSemana(); 
                gerarSlides();
                console.log(`✅ Sistema carregado: ${todasTurmas.length} turmas, ${todosAlunos.length} alunos`);

            } catch (err) { 
                exibirErroTerminal(err.message);
                console.error(err); 
            }
        }

        // ===== FUNÇÕES DE ATUALIZAÇÃO =====
        async function recarregarListaAlunos() {
            const sucesso = await carregarAlunos();
            if (sucesso) {
                if (document.getElementById('modal-sorteados').classList.contains('active')) {
                    atualizarListaAlunosModal();
                }
                atualizarSeletorTurmasSorteio();
                alert(`✅ Lista atualizada com sucesso!\n${todosAlunos.length} alunos carregados.`);
            } else {
                alert("❌ Erro ao atualizar lista de alunos.");
            }
        }

        async function forcarAtualizacaoCompleta() {
            const botao = event.target;
            botao.innerText = "⏳ Atualizando...";
            botao.disabled = true;
            try {
                await carregarDados();
                alert("✅ Dados atualizados com sucesso!");
            } catch (erro) {
                alert("❌ Erro ao atualizar dados.");
            } finally {
                setTimeout(() => {
                    botao.innerText = "🔄 Atualizar";
                    botao.disabled = false;
                }, 2000);
            }
        }

        function atualizarSeletorTurmasSorteio() {
            const seletor = document.getElementById("seletor-turma-sorteio");
            if (!seletor) return;
            
            const codigosAlunos = new Set(todosAlunos.map(a => a.codigoNormalizado));
            const turmasComAlunos = todasTurmas.filter(t => codigosAlunos.has(t.codigo));
            
            console.log(`📊 ${turmasComAlunos.length} turmas com alunos encontradas`);
            console.log("Códigos das turmas:", todasTurmas.map(t => `${t.nome} → ${t.codigo}`).join(", "));
            console.log("Códigos dos alunos:", [...codigosAlunos].sort().join(", "));
            
            const turmasParaMostrar = turmasComAlunos.length > 0 ? turmasComAlunos : todasTurmas;
            const turmaAtual = seletor.value;
            
            seletor.innerHTML = turmasParaMostrar.map(t => 
                `<option value="${t.codigo}" data-nome="${t.nome}" ${t.codigo === turmaAtual ? 'selected' : ''}>
                    ${t.nome}
                </option>`
            ).join('');
        }

        // ===== FUNÇÕES DO MODAL =====
        function abrirModalSorteados() {
            const modal = document.getElementById('modal-sorteados');
            modal.classList.add('active');
            const seletorTurma = document.getElementById('seletor-turma-modal');
            
            const turmasDisponiveis = todasTurmas.sort((a, b) => a.nome.localeCompare(b.nome));
            
            seletorTurma.innerHTML = '<option value="">Todas as Turmas</option>' + 
                turmasDisponiveis.map(t => 
                    `<option value="${t.codigo}" data-nome="${t.nome}">${t.nome}</option>`
                ).join('');
            
            atualizarListaAlunosModal();
        }

        function fecharModalSorteados() {
            document.getElementById('modal-sorteados').classList.remove('active');
            salvarSorteadosNoStorage();
            atualizarDisplayHistorico();
        }

        function atualizarListaAlunosModal() {
            const seletorTurma = document.getElementById('seletor-turma-modal');
            const turmaCodigoSelecionado = seletorTurma.value;
            const listaContainer = document.getElementById('lista-alunos-modal');
            
            let alunosParaMostrar = todosAlunos;
            if (turmaCodigoSelecionado) {
                alunosParaMostrar = todosAlunos.filter(a => 
                    a.codigoNormalizado === turmaCodigoSelecionado
                );
            }
            
            if (alunosParaMostrar.length === 0) {
                listaContainer.innerHTML = '<p class="text-slate-400 text-center py-4">Nenhum aluno encontrado para esta turma.</p>';
                return;
            }
            
            alunosParaMostrar.sort((a, b) => {
                const aSorteado = alunosJaSorteados.has(a.nome);
                const bSorteado = alunosJaSorteados.has(b.nome);
                if (aSorteado && !bSorteado) return 1;
                if (!aSorteado && bSorteado) return -1;
                return a.nome.localeCompare(b.nome);
            });
            
            listaContainer.innerHTML = alunosParaMostrar.map(aluno => {
                const jaSorteado = alunosJaSorteados.has(aluno.nome);
                const idSeguro = aluno.nome.replace(/[^a-zA-Z0-9]/g, '-');
                return `
                    <div class="flex items-center justify-between p-3 rounded-xl border ${jaSorteado ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'} transition-all">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="check-${idSeguro}" ${jaSorteado ? 'checked' : ''} 
                                onchange="toggleAlunoSorteado('${aluno.nome.replace(/'/g, "\\'")}', this.checked)"
                                class="w-5 h-5 accent-amber-500 cursor-pointer">
                            <label for="check-${idSeguro}" class="cursor-pointer">
                                <span class="font-bold text-slate-700">${aluno.nome}</span>
                                <span class="text-xs text-slate-400 ml-2">${aluno.turmaCodigo}</span>
                            </label>
                        </div>
                        ${jaSorteado ? '<span class="text-amber-600 font-black text-xs">✓ SORTEADO</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function ticarSom(frequenciaHz, duracaoMs) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequenciaHz, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duracaoMs/1000);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duracaoMs/1000);
            } catch(e) {}
        }

        function obterCoresPorValor(valor) {
            if (valor >= 95) return { hex: "#10b981", tailwindTxt: "text-emerald-500", shadow: "rgba(16,185,129,0.25)" };
            if (valor >= 90) return { hex: "#f59e0b", tailwindTxt: "text-amber-500", shadow: "rgba(245,158,11,0.25)" };
            return { hex: "#e11d48", tailwindTxt: "text-rose-500", shadow: "rgba(225,29,72,0.25)" };
        }

        function atualizarTextoSemana() {
            const hoje = new Date(); const inicioAnoLetivo = new Date(2026, 1, 2); 
            const diaSemanaHoje = hoje.getDay(); const diferencaSegunda = hoje.getDate() - (diaSemanaHoje === 0 ? 6 : diaSemanaHoje - 1);
            const segundaFeira = new Date(new Date(hoje).setDate(diferencaSegunda)); const domingo = new Date(new Date(segundaFeira).setDate(segundaFeira.getDate() + 6));
            const diferencaTempo = segundaFeira.getTime() - inicioAnoLetivo.getTime(); const numSem = Math.floor(diferencaTempo / (7 * 24 * 60 * 60 * 1000)) + 1;
            const fmt = (d) => d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
            document.getElementById("info-semana-detalhada").innerText = `Estatísticas da Semana ${numSem} • ${fmt(segundaFeira)} a ${fmt(domingo)}`;
            document.getElementById("info-semana-detalhada").classList.replace("text-rose-600", "text-indigo-600");
        }

        function embaralharArray(array) {

        function atualizarBarraTempoAvançado() {
            const currentSlide = document.querySelector(".pagina-slide.active");
            if (isPaused || sorteioEmAndamento || (currentSlide && currentSlide.classList.contains('slide-tipo-sorteio'))) return;
            const barra = document.getElementById('barra-tempo');
            const decorrido = Date.now() - tInicioSlide;

        function animarBarraECounter(idCard, valorFinal, tempoCustomizado) {
            const cardElement = document.getElementById(`card-${idCard}`);
            const barraElement = document.getElementById(`barra-${idCard}`);
            if (!cardElement && !barraElement) return;

            let valorAtual = 0; let tempoTotalEstimado = tempoCustomizado || 4500; let tempoInicio = null;

            function executarSubida(timestamp) {
                if (!tempoInicio) tempoInicio = timestamp;
                let tempoDecorrido = timestamp - tempoInicio;
                let tNorm = tempoDecorrido / tempoTotalEstimado;
                let fatorCurva = 1 - Math.pow(1 - Math.min(tNorm, 1), 4); 
                valorAtual = fatorCurva * valorFinal;

                if (tNorm >= 1 || valorAtual >= valorFinal) { valorAtual = valorFinal; }
                const coresDinamicas = obterCoresPorValor(valorAtual);

                if (barraElement) {
                    barraElement.innerText = valorAtual.toFixed(1) + "%";
                    barraElement.style.width = Math.min(valorAtual, 100) + "%";
                    barraElement.style.backgroundColor = coresDinamicas.hex;
                }
                
                if (cardElement) {
                    if (cardElement.classList.contains('card-turma')) cardElement.style.borderColor = coresDinamicas.hex;
                    const txtContador = cardElement.querySelector('.num-contador-txt');
                    if (txtContador) {
                        txtContador.innerText = valorAtual.toFixed(1) + "%";
                        txtContador.style.color = coresDinamicas.hex;
                    }
                }
                if (tNorm < 1 && valorAtual < valorFinal) { window.requestAnimationFrame(executarSubida); }
            }
            window.requestAnimationFrame(executarSubida);
        }

                    <text x="${largura - margemX + 5}" y="${yMeta + 3}" fill="#10b981" font-size="${isFull ? '12' : '9'}" font-weight="900">META</text>

                const coroaM = currentSlide.querySelector('.coroa-m');
                const coroaT = currentSlide.querySelector('.coroa-t');
                if (coroaM) { coroaM.style.transition = "none"; coroaM.style.opacity = "0"; coroaM.classList.remove("scale-110"); }
                if (coroaT) { coroaT.style.transition = "none"; coroaT.style.opacity = "0"; coroaT.classList.remove("scale-110"); }

                currentSlide.querySelectorAll('.card-bloco-media').forEach(el => { 
                    animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 4500);

            else if (currentSlide.classList.contains('slide-tipo-top5')) {

                        l.style.transition = "all 0.7s cubic-bezier(0.16, 1, 0.3, 1)";
                        l.style.opacity = "1"; l.style.transform = "translateY(0)";
                        const spanTxt = l.querySelector('.num-contador-txt');
                        if (spanTxt) {
                            let valFinal = parseFloat(l.dataset.target); let valAtual = 0;
                            function subir() {
                                valAtual += valFinal / 40;
                                if(valAtual >= valFinal) { valAtual = valFinal; } else { requestAnimationFrame(subir); }
                                spanTxt.innerText = valAtual.toFixed(1) + "%";
                                spanTxt.style.color = obterCoresPorValor(valFinal).hex;

                            subir();

            else if (currentSlide.classList.contains('slide-tipo-ranking')) {
                const pod1 = currentSlide.querySelector('.pod-ouro'), pod2 = currentSlide.querySelector('.pod-prata'), pod3 = currentSlide.querySelector('.pod-bronze');
                const demaisClass = currentSlide.querySelector('.demais-class-box');

                if (pod1) { pod1.style.animation = "none"; pod1.style.opacity = "0"; }
                if (pod2) { pod2.style.animation = "none"; pod2.style.opacity = "0"; }
                if (pod3) { pod3.style.animation = "none"; pod3.style.opacity = "0"; }
                if (demaisClass) { demaisClass.style.transition = "none"; demaisClass.style.opacity = "0"; }

                if (pod3) setTimeout(() => { 
                    pod3.style.opacity = "1"; pod3.style.animation = "subirPodio 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards";

                    animarBarraECounter(pod2.dataset.id, parseFloat(pod2.dataset.target), 2000);

                if (pod1) setTimeout(() => {

                        demaisClass.querySelectorAll('.card-bloco-media').forEach(el => { animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 2000); });
                    }
                }, 3600);
                setTimeout(dispararConfetesEspeciais, 5200);

            tRestante = tempoSlideMs; tInicioSlide = Date.now();
            if (!isPaused) {
                clearTimeout(loopInterval); cancelAnimationFrame(animBarra);
                loopInterval = setTimeout(() => mudarSlide(1), tempoSlideMs); atualizarBarraTempoAvançado();

        function iniciarSorteioVirtual() {
            if (sorteioEmAndamento) return;
            const seletor = document.getElementById("seletor-turma-sorteio"); 
            const turmaCodigoAlvo = seletor.value;
            const turmaNomeAlvo = seletor.options[seletor.selectedIndex]?.dataset.nome || '';
            
            console.log(`🔍 Sorteio para: ${turmaNomeAlvo} (Código: ${turmaCodigoAlvo})`);
            
            let alunosFiltrados = todosAlunos.filter(a => 
                a.codigoNormalizado === turmaCodigoAlvo
            );
            
            console.log(`📊 ${alunosFiltrados.length} alunos encontrados`);
            
            let alunosDisponiveis = alunosFiltrados.filter(a => !alunosJaSorteados.has(a.nome));
            
            const displayNome = document.getElementById("nome-sorteado-display");
            const btn = document.getElementById("btn-trigger-sorteio"); 
            const btnFechar = document.getElementById("btn-fechar-sorteio");
            
            if (alunosFiltrados.length === 0) { 
                displayNome.innerText = "Sem alunos!";
                ajustarFonteNomeSorteado("Sem alunos!");
                console.error("❌ Nenhum aluno encontrado para:", turmaCodigoAlvo);
                console.log("Códigos disponíveis:", [...new Set(todosAlunos.map(a => a.codigoNormalizado))].sort());
                return; 
            }

            if (alunosDisponiveis.length === 0) {
                displayNome.innerText = "Todos já sorteados!";
                ajustarFonteNomeSorteado("Todos já sorteados!");
                if (confirm('Todos os alunos desta turma já foram sorteados. Deseja resetar?')) {
                    alunosJaSorteados.clear();
                    salvarSorteadosNoStorage();
                    alunosDisponiveis = [...alunosFiltrados];
                } else {
                    return;
                }
            }

            if (alunosDisponiveis.length === 1) {
                displayNome.innerText = alunosDisponiveis[0].nome;
                ajustarFonteNomeSorteado(alunosDisponiveis[0].nome);
                return;
            }

            sorteioEmAndamento = true; 
            btn.style.display = "none"; 
            btnFechar.style.display = "none"; 
            seletor.disabled = true; 
            
            let listaEmbaralhada = embaralharArray([...alunosDisponiveis]);
            const alunoSorteado = listaEmbaralhada[Math.floor(Math.random() * listaEmbaralhada.length)];
            
            let giros = 0; 
            let velocidade = 70;
            let totalGiros = 30;
            let nomeAtual = "";
            
            displayNome.classList.add('sorteio-animando');

            function roletar() {
                giros++;
                
                if (giros < totalGiros * 0.7) {
                    const indiceAleatorio = Math.floor(Math.random() * alunosDisponiveis.length);
                    nomeAtual = alunosDisponiveis[indiceAleatorio].nome;
                } else {
                    const indiceSequencial = (giros - Math.floor(totalGiros * 0.7)) % listaEmbaralhada.length;
                    nomeAtual = listaEmbaralhada[indiceSequencial].nome;
                }
                
                displayNome.innerText = nomeAtual; 
                ajustarFonteNomeSorteado(nomeAtual);
                
                const frequenciaSom = 400 + (giros * 8);
                ticarSom(Math.min(frequenciaSom, 900), 30);
                
                if (giros < totalGiros) { 
                    if (giros > totalGiros * 0.6) velocidade += 12;
                    setTimeout(roletar, velocidade); 
                } else {
                    displayNome.innerText = alunoSorteado.nome;
                    ajustarFonteNomeSorteado(alunoSorteado.nome);
                    
                    displayNome.classList.remove('sorteio-animando');
                    displayNome.classList.add('vencedor-animacao');
                    
                    alunosJaSorteados.add(alunoSorteado.nome);
                    salvarSorteadosNoStorage();
                    
                    historicoSorteios.push({
                        nome: alunoSorteado.nome,
                        turma: turmaNomeAlvo,
                        horario: new Date().toLocaleTimeString('pt-BR')
                    });
                    
                    ticarSom(880, 250); 
                    setTimeout(() => ticarSom(1200, 300), 150); 
                    dispararConfetesEspeciais();
                    
                    let cLoop = setInterval(dispararConfetesEspeciais, 800);
                    setTimeout(() => { 
                        clearInterval(cLoop); 
                        sorteioEmAndamento = false; 
                        seletor.disabled = false;

        function gerarSlides() {
            const container = document.getElementById("container-slides");
            container.innerHTML = "";
            let currentGlobalId = 0;

            const manha = todasTurmas.filter(t => t.bloco.includes("man")).sort((a,b) => b.valor - a.valor);
            const tarde = todasTurmas.filter(t => t.bloco.includes("tard")).sort((a,b) => b.valor - a.valor);

            if (manha.length > 0) {
                currentGlobalId = montarPaginas(manha, "Turno da Manhã", "bg-gradient-to-r from-blue-700 to-indigo-800", currentGlobalId);
                currentGlobalId = montarSlideRankingTurno(manha, "Ranking Semanal • Manhã", "bg-gradient-to-r from-blue-800 to-sky-700", currentGlobalId);
            }
            if (tarde.length > 0) {
                currentGlobalId = montarPaginas(tarde, "Turno da Tarde", "bg-gradient-to-r from-orange-500 to-amber-600", currentGlobalId);
                currentGlobalId = montarSlideRankingTurno(tarde, "Ranking Semanal • Tarde", "bg-gradient-to-r from-orange-600 to-yellow-600", currentGlobalId);
            }

            const mediaManha = manha.length > 0 ? manha.reduce((acc, t) => acc + t.valor, 0) / manha.length : 0;
            const mediaTarde = tarde.length > 0 ? tarde.reduce((acc, t) => acc + t.valor, 0) / tarde.length : 0;
            if (manha.length > 0 && tarde.length > 0) {
                currentGlobalId = montarSlideDisputaTurnos(mediaManha, mediaTarde, currentGlobalId);
            }

            currentGlobalId = montarSlideTop5Geral(todasTurmas, currentGlobalId);
            currentGlobalId = montarSlideDesafioColetivo(currentGlobalId);
            currentGlobalId = montarSlideTrimestral(currentGlobalId);
            
            montarSlideSorteio();
            iniciarAnimacao();
        }

        function iniciarAnimacao() {
            if (loopInterval) clearTimeout(loopInterval);
            cancelAnimationFrame(animBarra);
            timersPagina.forEach(t => clearTimeout(t)); timersPagina = [];
            
            const slides = document.querySelectorAll(".pagina-slide");
            if (slides.length === 0) return;
            indexSlide = 0; slides[indexSlide].classList.add('active');
            const indicador = document.getElementById("indicador-pagina");
            if (indicador) indicador.innerText = `Pág. 1 de ${slides.length}`;
            
            const current = slides[0];
            if (current.classList.contains('slide-tipo-lista')) {
                const containerGrafico = current.querySelector('.box-plot-grafico');
                if (containerGrafico) { renderizarGraficoHistorico(containerGrafico.id); }
                current.querySelectorAll('.card-turma').forEach(el => { animarBarraECounter(el.dataset.id, parseFloat(el.dataset.target), 5000); });
            }
            tRestante = tempoSlideMs; tInicioSlide = Date.now();
            if (!isPaused) {
                loopInterval = setTimeout(() => mudarSlide(1), tempoSlideMs);
                atualizarBarraTempoAvançado();
            }
        }

        // Inicialização
        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
